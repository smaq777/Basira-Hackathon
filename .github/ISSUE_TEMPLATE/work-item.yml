name: Feature, documentation or research task
description: Scoped work with acceptance and evidence
title: '[TASK] '
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope and user need
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: '- [ ] Observable completion condition'
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests and evidence
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and exclusions
  - type: textarea
    id: risk
    attributes:
      label: Risk and rollback or forward-fix
    validations:
      required: true

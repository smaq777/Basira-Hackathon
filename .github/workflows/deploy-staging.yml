name: Deploy staging

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/development' && vars.DEPLOY_STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  railway:
    if: ${{ github.ref == 'refs/heads/development' && vars.DEPLOY_STAGING_ENABLED == 'true' && vars.DEPLOY_RAILWAY_ENABLED == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify Railway configuration is present
        run: test -n "$RAILWAY_TOKEN" && test -n "$RAILWAY_SERVICE_ID"
      - name: Deploy exact development revision to Railway staging
        run: npx -y @railway/cli@5.63.1 up --ci --environment staging --service "$RAILWAY_SERVICE_ID"

  vercel:
    if: ${{ github.ref == 'refs/heads/development' && vars.DEPLOY_STAGING_ENABLED == 'true' && vars.DEPLOY_VERCEL_ENABLED == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify Vercel configuration is present
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - name: Build and deploy Vercel preview
        run: |
          npx -y vercel@62.1.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx -y vercel@62.1.0 build --local-config=vercel.staging.json --token="$VERCEL_TOKEN"
          npx -y vercel@62.1.0 deploy --prebuilt --local-config=vercel.staging.json --token="$VERCEL_TOKEN"

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY after owner acceptance and staging verification
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY' && vars.DEPLOY_PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  railway:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY' && vars.DEPLOY_PRODUCTION_ENABLED == 'true' && vars.DEPLOY_RAILWAY_ENABLED == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify Railway configuration is present
        run: test -n "$RAILWAY_TOKEN" && test -n "$RAILWAY_SERVICE_ID"
      - name: Deploy exact main revision to Railway production
        run: npx -y @railway/cli@5.63.1 up --ci --environment production --service "$RAILWAY_SERVICE_ID"

  vercel:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY' && vars.DEPLOY_PRODUCTION_ENABLED == 'true' && vars.DEPLOY_VERCEL_ENABLED == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify Vercel configuration is present
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - name: Build and deploy Vercel production
        run: |
          npx -y vercel@62.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx -y vercel@62.1.0 build --prod --token="$VERCEL_TOKEN"
          npx -y vercel@62.1.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
